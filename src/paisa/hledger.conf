# hledger config file, used automatically by hledger commands run from this
# directory, which is where `just paisa` starts Paisa. Paisa reads the books
# with `hledger -f paisa.journal --auto print -Ojson` and can't pass a query.
#
# The yearly closing/opening pairs (tag clopen) would make every balance drop
# to 0 at the end of each Dec 31, so they are left out of Paisa's view.
# Launch Paisa with `just paisa` only, so that this file applies.

[print]
not:tag:clopen

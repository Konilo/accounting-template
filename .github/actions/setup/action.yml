name: Setup
description: Install hledger, just and uv, at the versions of the dev container

runs:
  using: composite
  steps:
    - name: Install hledger and just
      shell: bash
      run: |
        # Versions from the ARGs of the Dockerfile (CRLF line endings)
        version() { sed -n "s/^ARG $1=//p" .devcontainer/Dockerfile | tr -d '\r'; }
        hledger_version="$(version HLEDGER_VERSION)"
        just_version="$(version JUST_VERSION)"
        mkdir -p "$HOME/.local/bin"
        curl -sSfL "https://github.com/simonmichael/hledger/releases/download/$hledger_version/hledger-linux-x64.tar.gz" \
          | tar -xz -C "$HOME/.local/bin" hledger
        curl -sSfL "https://github.com/casey/just/releases/download/$just_version/just-$just_version-x86_64-unknown-linux-musl.tar.gz" \
          | tar -xz -C "$HOME/.local/bin" just
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        "$HOME/.local/bin/hledger" --version
        "$HOME/.local/bin/just" --version

    - name: Install uv
      uses: astral-sh/setup-uv@v10.2.0  # no major tag (v10) since v8
